<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Feuille de Suivi et d'Évaluation des Agents</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #002266;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #001144;
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .top-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-portail, .btn-fullscreen {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #002266;
            color: #ffffff;
            border: 1px solid #4466aa;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-portail:hover, .btn-fullscreen:hover {
            background-color: #003388;
        }
        .btn-fullscreen {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .btn-fullscreen:hover {
            background-color: #2563eb;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #a9c6ff;
            margin-bottom: 25px;
        }
        .file-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #4466aa;
            flex-wrap: wrap;
        }
        .header-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background-color: #002266;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #4466aa;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 14px;
            color: #a9c6ff;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            padding: 8px;
            background-color: #000822;
            border: 1px solid #ffffff;
            color: #ffffff;
            border-radius: 4px;
            font-size: 14px;
            color-scheme: dark;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #4466aa;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background-color: #003388;
            color: #ffffff;
            text-align: center;
        }
        .zone-header {
            background-color: #002255;
            color: #ffaa00;
            font-weight: bold;
            font-size: 15px;
        }
        .sub-header {
            background-color: #001a4d;
            color: #a9c6ff;
            font-weight: bold;
            font-size: 13px;
        }
        input[type="text"], textarea, select.table-select {
            width: 100%;
            padding: 6px;
            background-color: #000822;
            border: 1px solid #4466aa;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }
        textarea {
            resize: vertical;
            height: 50px;
        }
        button {
            background-color: #ffaa00;
            color: #001144;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #ffcc00;
        }
        .btn-secondary {
            background-color: #3366cc;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: #4488ff;
        }
        .btn-pdf {
            background-color: #28a745;
            color: #ffffff;
        }
        .btn-pdf:hover {
            background-color: #218838;
        }
        .btn-danger {
            background-color: #cc3333;
            color: #ffffff;
        }
        .btn-danger:hover {
            background-color: #ff4444;
        }
        .footer-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 900px) {
            .header-grid, .footer-sections {
                grid-template-columns: 1fr;
            }
        }
        #importFile {
            display: none;
        }

        @media print {
            body {
                background-color: #ffffff;
                color: #000000;
                padding: 0;
            }
            .container {
                background-color: #ffffff;
                border: none;
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .top-actions, .file-actions, .subtitle {
                display: none;
            }
            .header-grid, .footer-sections {
                background-color: #f1f1f1;
                border: 1px solid #ccc;
            }
            .form-group input, .form-group select, input[type="text"], textarea, select.table-select {
                background-color: #ffffff;
                color: #000000;
                border: 1px solid #ccc;
            }
            th {
                background-color: #003388 !important;
                color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .zone-header, .sub-header {
                background-color: #e0e0e0 !important;
                color: #000000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            th, td {
                border: 1px solid #999;
                color: #000000;
            }
        }
    </style>
</head>
<body>

    <script>
        const sectionsData = [
            {
                zone: "1. Préparation du chariot",
                colHeader: "Oui/Non",
                items: [
                    { label: "Chariot préparé à la prise de poste (produits consommables)", type: "oui_non" },
                    { label: "Lavettes pré-imprégnées (dosage de l'eau contrôlé)", type: "oui_non" },
                    { label: "Mop de lavage pré-imprégnées (dosage de l'eau et du produit contrôlé)", type: "oui_non" }
                ]
            },
            {
                zone: "2. Technique de nettoyage",
                colHeader: "Respecté oui/non",
                items: [
                    { label: "Dépoussiérage du sol avec la mop verte (uni)", type: "oui_non" },
                    { label: "Lavage du sol avec la grande mop rouge et verte", type: "oui_non" },
                    { label: "Présence de la bande de réserve pour le lavage des sols", type: "oui_non" },
                    { label: "Utilisation systématique du Kit Vitre pour les tables, tableaux et vitres", type: "oui_non" },
                    { label: "Présence de la bande de réserve sur les tables", type: "oui_non" },
                    { label: "Gestuelle kit vitre pour surfaces horizontales et verticales", type: "oui_non" },
                    { label: "Respect du code couleur des lavettes", type: "oui_non" }
                ]
            },
            {
                zone: "3. Rendu visuel et hygiène",
                colHeader: "Conforme oui/non",
                items: [
                    { label: "Sols : absence de traces (coins, angles)", type: "oui_non" },
                    { label: "Points de contact (poignées, interrupteurs, rampes)", type: "oui_non" },
                    { label: "Mobilier : absence de poussière, de taches pour les tables", type: "oui_non" },
                    { label: "Sanitaires (détartrage, absence d'odeur)", type: "oui_non" }
                ]
            },
            {
                zone: "4. Utilisation du matériel mécanisé",
                specialType: "materiel",
                colHeader: "Oui/Non",
                items: [
                    { label: "Aspirateur / Tous types d'aspirateurs", freq: "Hebdomadaire", etat: "Bien", val: "Non" },
                    { label: "Autolaveuse / Alternative à la monobrosse", freq: "Journalière", etat: "Bien", val: "Oui" },
                    { label: "Balayeuse / Préau et zones grises (extérieurs)", freq: "Mensuelle", etat: "Très bien", val: "Non" },
                    { label: "Nettoyeur vapeur / Hygiène sans produits chimique", freq: "Aux permanences", etat: "A perfectionner", val: "Oui" }
                ]
            },
            {
                zone: "5. Savoir être (en concertation avec le/la secrétaire général (e))",
                colHeader: "Conforme oui/non",
                items: [
                    { label: "Qualité du travail réalisé (Minutie, détails, rigueur...)", type: "conforme" },
                    { label: "Capacité à s'organiser et à respecter les délais", type: "conforme" },
                    { label: "Capacité à trouver des solutions aux problèmes rencontrés - prise d'initiatives - autonomie", type: "conforme" },
                    { label: "Capacité à travailler en équipe et faire preuve d'entraide", type: "conforme" },
                    { label: "Respect de la hiérarchie et des consignes - Capacité à rendre compte", type: "conforme" },
                    { label: "Acceptation des remarques, capacité à se remettre en question", type: "conforme" },
                    { label: "Ponctualité - assiduité - Disponibilité", type: "conforme" }
                ]
            }
        ];

        const frequencesList = ["Journalière", "Hebdomadaire", "Mensuelle", "Aux permanences", "Annuelle", "Ne l'utilise pas"];
        const etatsMatérielList = ["Bien", "Très bien", "A perfectionner","Sans Objet"];

        function buildTable(savedData = null) {
            const tbody = document.getElementById("evaluationTable");
            tbody.innerHTML = "";

            sectionsData.forEach((section, sIndex) => {
                const trZone = document.createElement("tr");
                trZone.innerHTML = `<td colspan="3" class="zone-header">${section.zone}</td>`;
                tbody.appendChild(trZone);

                const trSub = document.createElement("tr");
                if (section.specialType === "materiel") {
                    trSub.innerHTML = `
                        <td class="sub-header" style="width: 35%;">Critères :</td>
                        <td class="sub-header" style="width: 15%;">Oui / Non :</td>
                        <td class="sub-header" style="width: 50%;">
                            <div style="font-weight:bold;">Fréquence</div>
                            <div style="margin-top:2px; font-weight:bold;">Entretien du matériel</div>
                            <div style="margin-top:3px; font-weight:normal; font-style:italic;">Observation</div>
                        </td>
                    `;
                } else {
                    trSub.innerHTML = `
                        <td class="sub-header" style="width: 35%;">Critères :</td>
                        <td class="sub-header" style="width: 15%;">${section.colHeader}</td>
                        <td class="sub-header" style="width: 50%;">Observation</td>
                    `;
                }
                tbody.appendChild(trSub);

                section.items.forEach((item, iIndex) => {
                    const tr = document.createElement("tr");
                    const savedItem = savedData && savedData[sIndex] && savedData[sIndex][iIndex] ? savedData[sIndex][iIndex] : null;

                    if (section.specialType === "materiel") {
                        const valOuiNon = savedItem ? savedItem.val : item.val;
                        const valFreq = savedItem ? savedItem.freq : item.freq;
                        const valEtat = savedItem ? savedItem.etat : item.etat;
                        const obs = savedItem ? savedItem.obs : "";

                        let freqOptionsHtml = "";
                        frequencesList.forEach(f => {
                            freqOptionsHtml += `<option value="${f}" ${valFreq === f ? 'selected' : ''}>${f}</option>`;
                        });

                        let etatOptionsHtml = "";
                        etatsMatérielList.forEach(e => {
                            etatOptionsHtml += `<option value="${e}" ${valEtat === e ? 'selected' : ''}>${e}</option>`;
                        });

                        tr.innerHTML = `
                            <td><strong>${item.label}</strong></td>
                            <td>
                                <select class="table-select mat-oui">
                                    <option value="Oui" ${valOuiNon === 'Oui' ? 'selected' : ''}>Oui</option>
                                    <option value="Non" ${valOuiNon === 'Non' ? 'selected' : ''}>Non</option>
                                </select>
                            </td>
                            <td>
                                <div style="margin-bottom:5px;">
                                    <select class="table-select mat-freq">
                                        ${freqOptionsHtml}
                                    </select>
                                </div>
                                <div style="margin-bottom:5px;">
                                    <select class="table-select mat-etat">
                                        ${etatOptionsHtml}
                                    </select>
                                </div>
                                <textarea class="mat-obs" placeholder="Observation...">${obs}</textarea>
                            </td>
                        `;
                    } else if (item.type === "conforme") {
                        const valStatus = savedItem ? savedItem.val : "Conforme";
                        const obs = savedItem ? savedItem.obs : "";

                        tr.innerHTML = `
                            <td><strong>${item.label}</strong></td>
                            <td>
                                <select class="table-select standard-val">
                                    <option value="Conforme" ${valStatus === 'Conforme' ? 'selected' : ''}>Conforme</option>
                                    <option value="Non conforme" ${valStatus === 'Non conforme' ? 'selected' : ''}>Non conforme</option>
                                    <option value="Non évalué" ${valStatus === 'Non évalué' ? 'selected' : ''}>Non évalué</option>
                                </select>
                            </td>
                            <td><textarea class="standard-obs" placeholder="Observation...">${obs}</textarea></td>
                        `;
                    } else {
                        const valStatus = savedItem ? savedItem.val : "Oui";
                        const obs = savedItem ? savedItem.obs : "";

                        tr.innerHTML = `
                            <td><strong>${item.label}</strong></td>
                            <td>
                                <select class="table-select standard-val">
                                    <option value="Oui" ${valStatus === 'Oui' ? 'selected' : ''}>Oui</option>
                                    <option value="Non" ${valStatus === 'Non' ? 'selected' : ''}>Non</option>
                                    <option value="Non évalué" ${valStatus === 'Non évalué' ? 'selected' : ''}>Non évalué</option>
                                </select>
                            </td>
                            <td><textarea class="standard-obs" placeholder="Observation...">${obs}</textarea></td>
                        `;
                    }
                    tbody.appendChild(tr);
                });
            });
        }

        function getFormData() {
            let sectionsResult = [];
            let rowsArray = Array.from(document.querySelectorAll("#evaluationTable tr"));
            let currentSecData = [];

            rowsArray.forEach(tr => {
                if(tr.querySelector('.zone-header')) {
                    if(currentSecData.length > 0) sectionsResult.push(currentSecData);
                    currentSecData = [];
                } else if(!tr.querySelector('.sub-header')) {
                    const sel = tr.querySelector('.table-select');
                    const obsArea = tr.querySelector('textarea');
                    const freqSelect = tr.querySelector('.mat-freq');
                    const etatSelect = tr.querySelector('.mat-etat');

                    if(sel) {
                        let itemData = { val: sel.value, obs: obsArea ? obsArea.value : "" };
                        if(freqSelect) itemData.freq = freqSelect.value;
                        if(etatSelect) itemData.etat = etatSelect.value;
                        currentSecData.push(itemData);
                    }
                }
            });
            if(currentSecData.length > 0) sectionsResult.push(currentSecData);

            return {
                header: {
                    etablissement: document.getElementById("etablissement").value,
                    nomAgent: document.getElementById("nomAgent").value,
                    enPosteDepuis: document.getElementById("enPosteDepuis").value,
                    secretaireGeneral: document.getElementById("secretaireGeneral").value,
                    referentRsa: document.getElementById("referentRsa").value,
                    evaluateur: document.getElementById("evaluateur").value,
                    dateEvaluation: document.getElementById("dateEvaluation").value,
                    typeAgentSuivi: document.getElementById("typeAgentSuivi").value,
                    periodeBilan: document.getElementById("periodeBilan").value
                },
                sections: sectionsResult,
                footers: {
                    actionPrevoir: document.getElementById("actionPrevoir").value,
                    suggestions: document.getElementById("suggestions").value,
                    commRestauration: document.getElementById("commRestauration").value
                }
            };
        }

        function exportToPdf() {
            window.print();
        }

        function exportToJson() {
            const data = getFormData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `suivi_${data.header.typeAgentSuivi.replace(/\s+/g, '_')}_${data.header.etablissement.replace(/\s+/g, '_')}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importFromJson(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.header) {
                        document.getElementById("etablissement").value = data.header.etablissement || "";
                        document.getElementById("nomAgent").value = data.header.nomAgent || "";
                        document.getElementById("enPosteDepuis").value = data.header.enPosteDepuis || "";
                        document.getElementById("secretaireGeneral").value = data.header.secretaireGeneral || "";
                        document.getElementById("referentRsa").value = data.header.referentRsa || "";
                        document.getElementById("evaluateur").value = data.header.evaluateur || "";
                        document.getElementById("dateEvaluation").value = data.header.dateEvaluation || "";
                        document.getElementById("typeAgentSuivi").value = data.header.typeAgentSuivi || "CAED";
                        document.getElementById("periodeBilan").value = data.header.periodeBilan || "1er Bilan (Octobre)";
                    }
                    if (data.sections) {
                        buildTable(data.sections);
                    }
                    if (data.footers) {
                        document.getElementById("actionPrevoir").value = data.footers.actionPrevoir || "";
                        document.getElementById("suggestions").value = data.footers.suggestions || "";
                        document.getElementById("commRestauration").value = data.footers.commRestauration || "";
                    }
                } catch (error) {
                    alert("Erreur lors de l'import du fichier.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }

        function resetForm() {
            if (confirm("Voulez-vous vraiment réinitialiser toute la fiche de suivi ?")) {
                document.getElementById("nomAgent").value = "";
                document.getElementById("enPosteDepuis").value = "";
                document.getElementById("secretaireGeneral").value = "";
                document.getElementById("referentRsa").value = "";
                document.getElementById("evaluateur").value = "";
                const today = new Date().toISOString().split('T')[0];
                document.getElementById("dateEvaluation").value = today;
                document.getElementById("actionPrevoir").value = "";
                document.getElementById("suggestions").value = "";
                document.getElementById("commRestauration").value = "";
                buildTable();
            }
        }

        function basculerPleinEcran() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Erreur plein écran : ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("dateEvaluation").value = today;
            buildTable();
        };
    </script>
</body>
</html>
