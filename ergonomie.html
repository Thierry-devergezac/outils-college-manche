<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Plan d'Action — Santé, Sécurité & Prévention (Ergonomie)</title>
<div class="fullscreen-container">
            <button class="btn-fullscreen" onclick="basculerPleinEcran()">📺 Mode Plein Écran</button>
        </div>
    <!-- Inclusion de la bibliothèque SheetJS (xlsx) pour générer un vrai .xlsx propre -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #002266;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1700px;
            margin: 0 auto;
            background-color: #001144;
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        /* Style du bouton Retour au Portail */
        .btn-portail {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #002266;
            color: #ffffff;
            border: 1px solid #4466aa;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-portail:hover {
            background-color: #003388;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            color: #ffffff;
        }
        p.subtitle {
            text-align: center;
            color: #a9c6ff;
            margin-bottom: 25px;
        }
        .file-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #4466aa;
            flex-wrap: wrap;
        }
        .header-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background-color: #002266;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #4466aa;
            margin-bottom: 25px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 14px;
            color: #a9c6ff;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            padding: 8px;
            background-color: #000822;
            border: 1px solid #ffffff;
            color: #ffffff;
            border-radius: 4px;
            font-size: 14px;
            color-scheme: dark;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #4466aa;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }
        th {
            background-color: #003388;
            color: #ffffff;
            text-align: center;
        }
        input[type="text"], input[type="date"], textarea, select.table-select {
            width: 100%;
            padding: 6px;
            background-color: #000822;
            border: 1px solid #4466aa;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        /* Aperçu photo */
        .photo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .photo-preview {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 1px solid #4466aa;
            border-radius: 4px;
            background-color: #000822;
            display: none;
        }
        
        /* Codes couleurs pour la maîtrise des risques */
        .risk-vert { background-color: #28a745 !important; color: #fff; font-weight: bold; text-align: center; }
        .risk-orange { background-color: #ffc107 !important; color: #000; font-weight: bold; text-align: center; }
        .risk-rouge { background-color: #dc3545 !important; color: #fff; font-weight: bold; text-align: center; }

        button {
            background-color: #ffaa00;
            color: #001144;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #ffcc00; }
        .btn-secondary { background-color: #3366cc; color: #ffffff; }
        .btn-secondary:hover { background-color: #4488ff; }
        .btn-excel { background-color: #28a745; color: #ffffff; }
        .btn-excel:hover { background-color: #218838; }
        .btn-danger { background-color: #cc3333; color: #ffffff; }
        .btn-danger:hover { background-color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <!-- BOUTON RETOUR AU PORTAIL -->
        <div>
            <a href="index.html" class="btn-portail">
                ⬅ Retour au Portail Central
            </a>
        </div>

        <h1>Plan d'Action — Santé, Sécurité & Prévention (Ergonomie)</h1>
        <p class="subtitle">Référentiel d'entretien et suivi des préconisations par établissement</p>

        <!-- Barre d'actions -->
        <div class="file-actions">
            <button class="btn-excel" onclick="exportToXlsx()">📊 Exporter un vrai Vrai Excel (.xlsx)</button>
            <button class="btn-secondary" onclick="exportToJson()">💾 Sauvegarder (JSON)</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📂 Charger</button>
            <button class="btn-danger" onclick="resetForm()">🔄 Réinitialiser</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importFromJson(event)">
        </div>

        <!-- En-tête -->
        <div class="header-grid">
            <div class="form-group">
                <label>Établissement (Collège) :</label>
                <select id="etablissement">
                    <option value="Agon-Coutainville (Les Embruns)">Agon-Coutainville (Les Embruns)</option>
                    <option value="Avranches (Challemel Lacour)">Avranches (Challemel Lacour)</option>
                    <option value="Avranches (La Chaussonnière)">Avranches (La Chaussonnière)</option>
                    <option value="Brécey (Pierre Aguiton)">Brécey (Pierre Aguiton)</option>
                    <option value="Bréhal (La Vanière)">Bréhal (La Vanière)</option>
                    <option value="Bricquebec-en-Cotentin (Marcel Grillard)">Bricquebec-en-Cotentin (Marcel Grillard)</option>
                    <option value="Canisy (Jean Follain)">Canisy (Jean Follain)</option>
                    <option value="Carentan-les-Marais (Léon Gambetta)">Carentan-les-Marais (Léon Gambetta)</option>
                    <option value="Cerisy-la-Salle">Cerisy-la-Salle</option>
                    <option value="Cherbourg-en-Cotentin (Cachin)">Cherbourg-en-Cotentin (Cachin)</option>
                    <option value="Cherbourg-en-Cotentin (Diderot - Tourlaville)">Cherbourg-en-Cotentin (Diderot - Tourlaville)</option>
                    <option value="Cherbourg-en-Cotentin (Jules Ferry - Querqueville)">Cherbourg-en-Cotentin (Jules Ferry - Querqueville)</option>
                    <option value="Cherbourg-en-Cotentin (Bucaille-Charcot)">Cherbourg-en-Cotentin (Bucaille-Charcot)</option>
                    <option value="Cherbourg-en-Cotentin (Le Corre - Equeurdreville)">Cherbourg-en-Cotentin (Le Corre - Equeurdreville)</option>
                    <option value="Cherbourg-en-Cotentin (Le Ferronay)">Cherbourg-en-Cotentin (Le Ferronay)</option>
                    <option value="Cherbourg-en-Cotentin (Les Provinces)">Cherbourg-en-Cotentin (Les Provinces)</option>
                    <option value="Cherbourg-en-Cotentin (Zola - La Glacerie)">Cherbourg-en-Cotentin (Zola - La Glacerie)</option>
                    <option value="Coutances (Jacques Prévert)" selected>Coutances (Jacques Prévert)</option>
                    <option value="Ducey-Les Chéris (Gabriel de Montgomery)">Ducey-Les Chéris (Gabriel de Montgomery)</option>
                    <option value="Flamanville (Lucien Goubert)">Flamanville (Lucien Goubert)</option>
                    <option value="Gavray (R. Vaudatin)">Gavray (R. Vaudatin)</option>
                    <option value="Granville (André Malraux)">Granville (André Malraux)</option>
                    <option value="La Hague (Le Hague Dike)">La Hague (Le Hague Dike)</option>
                    <option value="La Haye (Etenclin)">La Haye (Etenclin)</option>
                    <option value="La Haye-Pesnel">La Haye-Pesnel</option>
                    <option value="Isigny-le-Buat (Jozeau-Marigné)">Isigny-le-Buat (Jozeau-Marigné)</option>
                    <option value="Lessay (Desdevises du Dézert)">Lessay (Desdevises du Dézert)</option>
                    <option value="Marigny-le-Lozon (Jean Monnet)">Marigny-le-Lozon (Jean Monnet)</option>
                    <option value="Montebourg (Tiphaigne de la Roche)">Montebourg (Tiphaigne de la Roche)</option>
                    <option value="Montmartin-sur-Mer (Les Courtils)">Montmartin-sur-Mer (Les Courtils)</option>
                    <option value="Mortain-Bocage (Robert de Mortain)">Mortain-Bocage (Robert de Mortain)</option>
                    <option value="Percy-en-Normandie (Moulin de Haut)">Percy-en-Normandie (Moulin de Haut)</option>
                    <option value="Périers">Périers</option>
                    <option value="Les Pieux (Le Castillon)">Les Pieux (Le Castillon)</option>
                    <option value="Pontorson (Georges Brassens)">Pontorson (Georges Brassens)</option>
                    <option value="Portbail (André Miclot)">Portbail (André Miclot)</option>
                    <option value="Saint-Clair-sur-Elle (Jean Grémillon)">Saint-Clair-sur-Elle (Jean Grémillon)</option>
                    <option value="Saint-Hilaire-du-Harcouët">Saint-Hilaire-du-Harcouët</option>
                    <option value="Saint-James (Le Clos Tardif)">Saint-James (Le Clos Tardif)</option>
                    <option value="Saint-Jean-de-Daye (Le Marais)">Saint-Jean-de-Daye (Le Marais)</option>
                    <option value="Saint-Lô (Lavalley)">Saint-Lô (Lavalley)</option>
                    <option value="Saint-Lô (Pasteur)">Saint-Lô (Pasteur)</option>
                    <option value="Saint-Pierre-Église (Gilles de Gouberville)">Saint-Pierre-Église (Gilles de Gouberville)</option>
                    <option value="Saint-Sauveur-Lendelin">Saint-Sauveur-Lendelin</option>
                    <option value="Saint-Sauveur-le-Vicomte (Barbey d'Aurévilly)">Saint-Sauveur-le-Vicomte (Barbey d'Aurévilly)</option>
                    <option value="Saint-Vaast-la-Hougue (Guillaume Fouace)">Saint-Vaast-la-Hougue (Guillaume Fouace)</option>
                    <option value="Sainte-Mère-Église (Saint-Exupéry)">Sainte-Mère-Église (Saint-Exupéry)</option>
                    <option value="Sartilly-Baie-Bocage (Anatole France)">Sartilly-Baie-Bocage (Anatole France)</option>
                    <option value="Tessy-Bocage (R. Queneau)">Tessy-Bocage (R. Queneau)</option>
                    <option value="Torigni-les-Villes (A. Camus)">Torigni-les-Villes (A. Camus)</option>
                    <option value="Valognes (Félix Buhot)">Valognes (Félix Buhot)</option>
                    <option value="Villedieu-les-Poêles-Rouffigny (Le Dinandier)">Villedieu-les-Poêles-Rouffigny (Le Dinandier)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date du document :</label>
                <input type="date" id="dateDocument">
            </div>
            <div class="form-group">
                <label>Piloté par :</label>
                <input type="text" id="pilote" value="Thierry de Vergezac (Référent)">
            </div>
        </div>

        <!-- Tableau principal -->
        <table>
            <thead>
                <tr>
                    <th style="width: 4%;">N°</th>
                    <th style="width: 14%;">Lieux / Date</th>
                    <th style="width: 11%;">Danger</th>
                    <th style="width: 10%;">Maîtrise du risque</th>
                    <th style="width: 21%;">Remarques / Constats</th>
                    <th style="width: 18%;">Préconisations</th>
                    <th style="width: 12%;">Photos</th>
                    <th style="width: 10%;">Devis ou action / Financement</th>
                </tr>
            </thead>
            <tbody id="actionTableBody">
                <!-- Généré dynamiquement -->
            </tbody>
        </table>

        <div style="text-align: right;">
            <button onclick="addRow()">➕ Ajouter une ligne</button>
        </div>
    </div>

    <script>
        let tableData = [
            { lieu: "La Haye-Pesnel\n28/05/2024", danger: "Matériel", maitrise: "orange", remarques: "Les agents sont dotés de chariots ergonomiques, d'une autolaveuse, d'un nettoyeur vapeur.", preconisations: "Formation à la méthode de pré imprégnation prévu le 29 mai 2024", photo: "", devisFinancement: "" },
            { lieu: "La Haye-Pesnel\n28/05/2025", danger: "Référentiel", maitrise: "orange", remarques: "Le référentiel est connu et a été diffusé aux agents, le mode adapté est mis en œuvre en cas de nécessité.", preconisations: "", photo: "", devisFinancement: "" },
            { lieu: "La Haye-Pesnel\n28/05/2026", danger: "Locaux", maitrise: "orange", remarques: "L'externat est assez vieux, seule la partie restauration a été refaite en 2020. Hormis la vétusté de l'externat les locaux sont très bien entretenus par les agents.", preconisations: "Dans la lingerie les machines sont à même le sol, pour l'ergonomie il faudrait rehausser les machines.", photo: "", devisFinancement: "" },
            { lieu: "La Haye-Pesnel\n28/05/2027", danger: "Agents", maitrise: "vert", remarques: "L'établissement a actuellement 3 agents titulaires et une contractuelle à temps partiel, pour l'entretien de l'ensemble des locaux. Les agents ont à cœur de bien effectuer leur travail.", preconisations: "", photo: "", devisFinancement: "" },
            { lieu: "La Haye-Pesnel\n28/05/2028", danger: "Produits", maitrise: "orange", remarques: "L'établissement est dans l'attente de l'installation d'une centrale de dilution.", preconisations: "Mettre à jour le classeur des fiches de données de sécurité.", photo: "", devisFinancement: "" }
        ];

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("dateDocument").value = today;
            renderTable();
        };

        function renderTable() {
            const tbody = document.getElementById("actionTableBody");
            tbody.innerHTML = "";

            tableData.forEach((item, index) => {
                const tr = document.createElement("tr");

                let maitriseClass = "risk-orange";
                if (item.maitrise === "vert") maitriseClass = "risk-vert";
                if (item.maitrise === "rouge") maitriseClass = "risk-rouge";

                tr.innerHTML = `
                    <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                    <td><textarea oninput="updateData(${index}, 'lieu', this.value)">${item.lieu}</textarea></td>
                    <td><input type="text" value="${item.danger}" oninput="updateData(${index}, 'danger', this.value)"></td>
                    <td>
                        <select class="table-select ${maitriseClass}" onchange="updateMaitrise(${index}, this.value)">
                            <option value="vert" ${item.maitrise === 'vert' ? 'selected' : ''}>Maîtrisé (Vert)</option>
                            <option value="orange" ${item.maitrise === 'orange' ? 'selected' : ''}>À surveiller (Orange)</option>
                            <option value="rouge" ${item.maitrise === 'rouge' ? 'selected' : ''}>Critique (Rouge)</option>
                        </select>
                    </td>
                    <td><textarea oninput="updateData(${index}, 'remarques', this.value)">${item.remarques}</textarea></td>
                    <td><textarea oninput="updateData(${index}, 'preconisations', this.value)">${item.preconisations}</textarea></td>
                    <td>
                        <div class="photo-container">
                            <input type="file" accept="image/*" style="font-size: 11px;" onchange="loadPhoto(${index}, event)">
                            <img id="img-preview-${index}" class="photo-preview" src="${item.photo || ''}" style="${item.photo ? 'display:block;' : ''}">
                        </div>
                    </td>
                    <td>
                        <textarea oninput="updateData(${index}, 'devisFinancement', this.value)">${item.devisFinancement}</textarea>
                        <button class="btn-danger" style="padding: 4px 8px; font-size: 11px; margin-top: 5px;" onclick="deleteRow(${index})">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateData(index, field, value) {
            tableData[index][field] = value;
        }

        function updateMaitrise(index, value) {
            tableData[index].maitrise = value;
            renderTable();
        }

        function loadPhoto(index, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tableData[index].photo = e.target.result;
                    const img = document.getElementById(`img-preview-${index}`);
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function addRow() {
            const etab = document.getElementById("etablissement").value;
            const currentYear = new Date().getFullYear();
            tableData.push({
                lieu: `${etab}\n01/01/${currentYear}`,
                danger: "Nouveau risque",
                maitrise: "orange",
                remarques: "",
                preconisations: "",
                photo: "",
                devisFinancement: ""
            });
            renderTable();
        }

        function deleteRow(index) {
            if (confirm("Voulez-vous supprimer cette ligne ?")) {
                tableData.splice(index, 1);
                renderTable();
            }
        }

        function resetForm() {
            if (confirm("Réinitialiser le tableau complet ?")) {
                tableData = [];
                renderTable();
            }
        }

        function exportToXlsx() {
            const etab = document.getElementById("etablissement").value;
            const dateDoc = document.getElementById("dateDocument").value;
            const pilote = document.getElementById("pilote").value;

            let excelRows = [
                ["PLAN D'ACTION - SANTÉ, SÉCURITÉ & PRÉVENTION (ERGONOMIE)"],
                ["Établissement", etab],
                ["Date du document", dateDoc],
                ["Piloté par", pilote],
                [],
                ["N°", "Lieux / Date", "Danger", "Maîtrise du risque", "Remarques / Constats", "Préconisations", "Devis ou action / Financement"]
            ];

            tableData.forEach((item, idx) => {
                excelRows.push([
                    idx + 1,
                    item.lieu,
                    item.danger,
                    item.maitrise.toUpperCase(),
                    item.remarques,
                    item.preconisations,
                    item.devisFinancement
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(excelRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Plan d'Action");

            const fileName = `plan_action_${etab.toLowerCase().replace(/[^a-z0-9]/g, '_')}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        function exportToJson() {
            const dataToSave = {
                etablissement: document.getElementById("etablissement").value,
                dateDocument: document.getElementById("dateDocument").value,
                pilote: document.getElementById("pilote").value,
                rows: tableData
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToSave, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `plan_action_${dataToSave.etablissement.toLowerCase().replace(/[^a-z0-9]/g, '_')}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importFromJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.etablissement) document.getElementById("etablissement").value = parsed.etablissement;
                    if (parsed.dateDocument) document.getElementById("dateDocument").value = parsed.dateDocument;
                    if (parsed.pilote) document.getElementById("pilote").value = parsed.pilote;
                    if (parsed.rows) {
                        tableData = parsed.rows;
                        renderTable();
                    }
                } catch (err) {
                    alert("Erreur lors de l'import du fichier JSON.");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }
    function basculerPleinEcran() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Erreur passage plein écran : ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>   
</body>
</html>
