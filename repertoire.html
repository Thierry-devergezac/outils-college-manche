    // Remplissage automatique de la liste déroulante au chargement
    window.onload = function() {
        const select = document.getElementById("collegeSelect");
        colltimes.forEach(c => {
            let option = document.createElement("option");
            option.value = c.id;
            option.textContent = c.commune + " — " + c.nom;
            select.appendChild(option);
        });
    };

    // Fonction déclenchée à chaque changement de sélection
    function afficherInfosCollege() {
        const selectedId = document.getElementById("collegeSelect").value;
        const card = document.getElementById("collegeCard");

        if (!selectedId) {
            card.style.display = "none";
            return;
        }

        const college = colltimes.find(c => c.id == selectedId);

        if (college) {
            document.getElementById("nomCommune").textContent = college.commune + " — " + college.nom;
            document.getElementById("valTelephone").textContent = college.tel;
            
            document.getElementById("valPrincipal").value = college.principal;
            document.getElementById("valSecetaire").value = college.secretaire;

            const mailPNode = document.getElementById("linkMailPrincipal");
            mailPNode.textContent = college.mailP;
            mailPNode.href = "mailto:" + college.mailP + "?subject=Contact%20terrain%20-%20Collège%20" + encodeURIComponent(college.nom);

            const mailGNode = document.getElementById("linkMailGestionnaire");
            mailGNode.textContent = college.mailG;
            mailGNode.href = "mailto:" + college.mailG + "?subject=Question%20gestion%20-%20Collège%20" + encodeURIComponent(college.nom);

            card.style.display = "block";
        }
    }
